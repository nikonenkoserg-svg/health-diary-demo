<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Проба — карандаш</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#14141b;--pencil:#d3d3dc;--accent:#e8845a;--dim:#7d7d8a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
    font-family:'Caveat',cursive;color:var(--pencil)}
  #wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  svg{width:min(94vw,440px);height:auto}
  .stroke{fill:none;stroke:var(--pencil);stroke-width:2;stroke-linecap:round;filter:url(#pencil)}
  .axis{stroke:var(--dim);stroke-width:1.6}
  .link{stroke:var(--accent);stroke-width:2.4}
  .dot{fill:var(--accent);filter:url(#pencil);opacity:0}
  .lab{font-size:26px;fill:var(--pencil);opacity:0;font-weight:500}
  .num{font-size:24px;fill:#fff;opacity:0;font-weight:700}
  .title{font-size:34px;fill:var(--pencil);opacity:0;font-weight:700}
  .replay{margin-top:6px;color:var(--dim);background:none;border:1px solid #33333f;border-radius:20px;
    padding:6px 18px;font-family:-apple-system,sans-serif;font-size:14px;opacity:0;transition:opacity .5s}
  .replay.show{opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <svg id="s" viewBox="0 0 360 220">
    <defs>
      <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
      </filter>
    </defs>
    <text class="title" x="30" y="34">С чего начинаем</text>
    <path class="stroke axis" id="ax" d="M34,180 L332,180"/>
    <path class="stroke axis" id="ay" d="M34,50 L34,180"/>

    <path class="stroke link" id="ln" d="M84,140 Q130,150 176,86 Q230,110 280,150"/>

    <circle class="dot" id="d1" cx="84"  cy="140" r="6"/>
    <circle class="dot" id="d2" cx="176" cy="86"  r="6"/>
    <circle class="dot" id="d3" cx="280" cy="150" r="6"/>

    <text class="num" id="n1" x="84"  y="124" text-anchor="middle">6.1</text>
    <text class="num" id="n2" x="176" y="70"  text-anchor="middle">пик</text>
    <text class="num" id="n3" x="280" y="134" text-anchor="middle">5.5</text>

    <text class="lab" id="l1" x="84"  y="202" text-anchor="middle">натощак</text>
    <text class="lab" id="l2" x="176" y="202" text-anchor="middle">после еды</text>
    <text class="lab" id="l3" x="280" y="202" text-anchor="middle">чистая ночь</text>
  </svg>
  <button class="replay" id="rp" onclick="play()">↻ ещё раз</button>
</div>
<script>
const $=s=>document.querySelector(s), wait=ms=>new Promise(r=>setTimeout(r,ms));
function draw(el,dur){return new Promise(res=>{
  const len=el.getTotalLength();
  el.style.strokeDasharray=len; el.style.strokeDashoffset=len; el.getBoundingClientRect();
  el.animate([{strokeDashoffset:len},{strokeDashoffset:0}],{duration:dur,easing:'ease-in-out',fill:'forwards'});
  setTimeout(res,dur);
});}
function pop(el,dur=300){return new Promise(res=>{
  el.animate([{opacity:0,transform:'scale(.2)'},{opacity:1,transform:'scale(1)'}],
    {duration:dur,easing:'cubic-bezier(.2,.9,.3,1.2)',fill:'forwards'}); setTimeout(res,dur);
});}
function fade(el,dur=350){return new Promise(res=>{
  el.animate([{opacity:0},{opacity:1}],{duration:dur,fill:'forwards'}); setTimeout(res,dur);
});}
async function play(){
  ['ax','ay','ln'].forEach(id=>{const e=$('#'+id);e.style.strokeDasharray='';e.style.strokeDashoffset='';});
  document.querySelectorAll('.dot,.num,.lab,.title').forEach(e=>e.style.opacity=0);
  $('#rp').classList.remove('show');
  await wait(300);
  await fade($('#title')||$('.title'));
  await draw($('#ax'),600); await draw($('#ay'),500);
  // три замера последовательно: точка рисуется, цифра, ярлык
  const steps=[['d1','n1','l1'],['d2','n2','l2'],['d3','n3','l3']];
  for(const [d,n,l] of steps){
    await pop($('#'+d)); await fade($('#'+n),250); await fade($('#'+l),250); await wait(150);
  }
  // связь дочерчивается поверх
  await draw($('#ln'),900);
  await wait(200); $('#rp').classList.add('show');
}
window.addEventListener('load',()=>setTimeout(play,400));
</script>
</body>
</html>
