<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f1a">
<title>Дневник здоровья</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/chat.css">
</head>
<body>

<div id="app">
  <header id="header">
    <div class="header-left">
      <button id="btnSettings" class="icon-btn" aria-label="Настройки">⚙</button>
    </div>
    <div class="header-center">
      <span class="header-title">Дневник</span>
    </div>
    <div class="header-right">
      <button id="btnTheme" class="icon-btn" aria-label="Тема">🌙</button>
    </div>
  </header>

  <main id="screens">
    <section id="screen-chat" class="screen active">
      <div id="chat" class="chat-area"></div>
      <div class="input-area">
        <button id="btnMic" class="mic-btn" aria-label="Голосовой ввод">🎤</button>
        <textarea id="input" rows="1" placeholder="Напишите или скажите голосом..."></textarea>
        <button id="btnSend" class="send-btn" disabled aria-label="Отправить">↑</button>
      </div>
    </section>

    <section id="screen-diary" class="screen">
      <div class="diary-area">
        <p class="placeholder-text">Дневник появится после первого разговора</p>
      </div>
    </section>

    <section id="screen-insights" class="screen">
      <div class="insights-area">
        <p class="placeholder-text">Инсайты появятся после первых записей</p>
      </div>
    </section>
  </main>

  <nav id="tabbar">
    <button class="tab active" data-screen="chat">
      <span class="tab-icon">💬</span>
      <span class="tab-label">Разговор</span>
    </button>
    <button class="tab" data-screen="diary">
      <span class="tab-icon">📋</span>
      <span class="tab-label">Дневник</span>
    </button>
    <button class="tab" data-screen="insights">
      <span class="tab-icon">📊</span>
      <span class="tab-label">Инсайты</span>
    </button>
  </nav>

  <div id="settings-panel" class="settings-panel hidden">
    <div class="settings-content">
      <div class="settings-header">
        <span>Настройки</span>
        <button id="btnCloseSettings" class="icon-btn">✕</button>
      </div>
      <div class="settings-item">
        <span>Размер шрифта</span>
        <button id="btnFont" class="settings-btn">A+</button>
      </div>
      <div class="settings-item">
        <span>Экспорт данных</span>
        <button id="btnExport" class="settings-btn">💾</button>
      </div>
      <div class="settings-item">
        <span>Импорт данных</span>
        <button id="btnImport" class="settings-btn">📂</button>
      </div>
      <input type="file" id="fileImport" accept=".json" hidden>
      <div class="settings-item">
        <span>Копировать чат</span>
        <button id="btnCopyChat" class="settings-btn">📋</button>
      </div>
      <div class="settings-item settings-danger">
        <span>Удалить все данные</span>
        <button id="btnClear" class="settings-btn danger">🗑</button>
      </div>
    </div>
  </div>
</div>

<script src="/js/storage.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/voice.js"></script>
<script src="/knowledge/core-style.js"></script>
<script src="/js/onboarding.js"></script>
<script src="/js/assistant.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
