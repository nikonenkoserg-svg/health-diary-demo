<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f1a">
<title>Дневник здоровья</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/chat.css">
  <link rel="stylesheet" href="/css/profile.css?v=20260620a">
  <link rel="stylesheet" href="/css/auth.css?v=20260623a">
</head>
<body>

<div id="app">
  <header id="header">
    <div class="header-left">
      <button id="btnSettings" class="icon-btn" aria-label="Настройки">⚙</button>
    </div>
    <div class="header-center">
      <span class="header-title">Дневник</span>
    </div>
    <div class="header-right">
      <button id="btnProfile" class="icon-btn" aria-label="Профиль" title="Мой профиль">☰</button>
      <button id="btnTheme" class="icon-btn" aria-label="Тема">🌙</button>
    </div>
  </header>

  <main id="screens">
    <section id="screen-chat" class="screen active">
      <div id="chart-panel" class="chart-panel hidden">
        <div class="chart-panel-header">
          <span id="chart-phase-label" class="chart-phase-label">СЕГОДНЯ</span>
          <button id="btnToggleChart" class="chart-toggle" aria-label="Свернуть">▼</button>
        </div>
        <div id="chart-headline" class="chart-headline"></div>
        <div id="chart-foods-pill" class="chart-foods-pill"></div>
        <div id="chart-lever-card" class="chart-lever-card hidden">
          <div id="chart-lever-title" class="chart-lever-title"></div>
          <div id="chart-lever-body" class="chart-lever-body"></div>
        </div>
        <div id="chart-key-numbers" class="chart-key-numbers"></div>
        <div id="chart-canvas-wrap" class="chart-canvas-wrap">
          <canvas id="chartMain"></canvas>
        </div>
        <div id="chart-retrospective" class="chart-retrospective hidden">
          <div class="retro-cards">
            <div class="retro-card">
              <div class="retro-card-label">пик</div>
              <div class="retro-card-value" id="retro-peak-value">—</div>
              <div class="retro-card-sub" id="retro-peak-time"></div>
              <div class="retro-card-divider"></div>
              <div class="retro-card-label">опустился ниже 7.8 в</div>
              <div class="retro-card-value-small" id="retro-return-time">—</div>
            </div>
            <div class="retro-card">
              <div class="retro-card-label">время в зоне выше нормы</div>
              <div class="retro-card-value-big" id="retro-zone-time">—</div>
              <div class="retro-card-sub" id="retro-zone-range"></div>
            </div>
          </div>
          <div class="retro-sparkline-wrap">
            <div class="retro-sparkline-label">КРИВАЯ ДНЯ</div>
            <canvas id="retro-sparkline" class="retro-sparkline"></canvas>
          </div>
        </div>
      </div>
      <div id="chat" class="chat-area"></div>
      <div class="input-area">
        <button id="btnMic" class="mic-btn" aria-label="Голосовой ввод">🎤</button>
        <textarea id="input" rows="1" placeholder="Напишите или скажите голосом..."></textarea>
        <button id="btnSend" class="send-btn" disabled aria-label="Отправить">↑</button>
      </div>
    </section>

  </main>

  <div id="settings-panel" class="settings-panel hidden">
    <div class="settings-content">
      <div class="settings-header">
        <span>Настройки <span class="settings-version" id="settingsVersion">v—</span></span>
        <button id="btnCloseSettings" class="icon-btn">✕</button>
      </div>
      <div class="settings-item">
        <span>Часовой пояс</span>
        <button id="btnTimezone" class="settings-btn" title="Сменить часовой пояс">—</button>
      </div>
      <div class="settings-item">
        <span>Размер шрифта</span>
        <button id="btnFont" class="settings-btn">A+</button>
      </div>
      <div class="settings-item">
        <span>Экспорт данных</span>
        <button id="btnExport" class="settings-btn">💾</button>
      </div>
      <div class="settings-item">
        <span>Импорт данных</span>
        <button id="btnImport" class="settings-btn">📂</button>
      </div>
      <input type="file" id="fileImport" accept=".json" hidden>
      <div class="settings-item">
        <span>Копировать чат</span>
        <button id="btnCopyChat" class="settings-btn">📋</button>
      </div>
      <div class="settings-item">
        <span>Сбросить кеш и обновить</span>
        <button id="btnForceUpdate" class="settings-btn">🔄</button>
      </div>
      <div class="settings-item settings-danger">
        <span>Удалить все данные</span>
        <button id="btnClear" class="settings-btn danger">🗑</button>
      </div>
    </div>
  </div>
</div>

<script src="/js/storage.js?v=20260615a"></script>
<script src="/js/profile-store.js?v=20260620a"></script>
<script src="/js/profile-orchestrator.js?v=20260620a"></script>
<script src="/js/profile-overlay.js?v=20260620a"></script>
<script src="/js/time.js?v=20260615a"></script>
<script src="/js/theme.js?v=20260615a"></script>
<script src="/js/voice.js?v=20260615a"></script>
<script src="/knowledge/core-style.js?v=20260609b"></script>
<script src="/js/engine.v2.js?v=20260615a"></script>
<script src="/js/chart.js?v=20260615a"></script>
<script src="/js/chart-overlay.js?v=20260610a"></script>
<script src="/js/auth.js?v=20260623a"></script>
<script src="/js/onboarding.js?v=20260615a"></script>
<script src="/js/rag.js?v=20260609b"></script>
<script type="module">
  import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2";
  window.transformers = { pipeline, env };
  if (window.RAG) RAG.init().catch(e => console.warn("[RAG] init failed:", e));
</script>
<script src="/js/assistant.js?v=20260609b"></script>
<script src="/js/chat.js?v=20260614c"></script>
<script src="/js/app.js?v=20260615a"></script>
</body>
</html>
