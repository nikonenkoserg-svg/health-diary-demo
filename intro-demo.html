<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Дневник — как это работает</title>
<style>
  :root{ --bg:#0d0d13; --panel:#1c1c26; --ink:#e9e9f0; --dim:#8a8a99; --accent:#e8845a; --grid:#2a2a36; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,'SF Pro Text',Roboto,Segoe UI,sans-serif;overflow:hidden}
  #stage{position:relative;height:100%;width:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;padding:24px}
  .skip{position:absolute;top:16px;right:18px;color:var(--dim);font-size:14px;
    background:none;border:none;letter-spacing:.3px;z-index:10}
  /* глюкометр */
  #meterWrap{width:150px;height:250px;position:relative;transform:translateY(60px) scale(.6);
    opacity:0;transition:transform 1s cubic-bezier(.2,.8,.2,1),opacity .7s}
  #meterWrap.in{transform:translateY(0) scale(1);opacity:1}
  #meterWrap.shift{transform:translateY(-8px) scale(.82);opacity:1}
  .screen-num{font-variant-numeric:tabular-nums;font-weight:700;font-size:34px;fill:var(--accent)}
  .strip-drop{opacity:0}
  .strip-drop.show{opacity:1;transition:opacity .3s}
  #flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 20%,rgba(232,132,90,.55),transparent 60%);
    opacity:0;pointer-events:none}
  #flash.go{animation:flash .5s ease-out}
  @keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
  /* подпись-ярлык */
  #label{font-size:15px;color:var(--accent);letter-spacing:.5px;font-weight:600;min-height:20px;opacity:0;
    transition:opacity .4s;text-transform:uppercase}
  #label.show{opacity:1}
  /* комментарий-пузырь */
  #bubble{max-width:340px;background:var(--panel);border-radius:16px;padding:14px 16px;font-size:15px;
    line-height:1.5;color:var(--ink);min-height:22px;opacity:0;transform:translateY(8px);
    transition:opacity .4s,transform .4s}
  #bubble.show{opacity:1;transform:none}
  .caret{border-right:2px solid var(--accent);animation:blink 1s step-end infinite;padding-right:1px}
  @keyframes blink{50%{border-color:transparent}}
  /* мини-график */
  #chart{width:340px;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
  #chart.show{opacity:1;transform:none}
  .dot{opacity:0}
  .replay{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);color:var(--dim);
    background:none;border:1px solid var(--grid);border-radius:20px;padding:8px 18px;font-size:14px;
    opacity:0;transition:opacity .5s}
  .replay.show{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <button class="skip" onclick="location.href='/'">пропустить ›</button>

  <div id="meterWrap">
    <svg viewBox="0 0 150 250" width="150" height="250">
      <defs>
        <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#3a3a48"/><stop offset="1" stop-color="#23232e"/>
        </linearGradient>
      </defs>
      <rect x="18" y="10" width="114" height="185" rx="20" fill="url(#body)" stroke="#454556" stroke-width="1.5"/>
      <rect x="34" y="30" width="82" height="60" rx="8" fill="#0b0f0c"/>
      <text id="numText" class="screen-num" x="75" y="72" text-anchor="middle"></text>
      <circle cx="75" cy="112" r="5" fill="#454556"/>
      <rect x="60" y="128" width="30" height="14" rx="3" fill="#2c2c38"/>
      <!-- тест-полоска -->
      <rect x="67" y="192" width="16" height="46" rx="2" fill="#c9c9d4"/>
      <circle class="strip-drop" id="drop" cx="75" cy="238" r="7" fill="#d64545"/>
    </svg>
    <div id="flash"></div>
  </div>

  <div id="label"></div>
  <div id="bubble"></div>

  <svg id="chart" viewBox="0 0 340 150">
    <line x1="34" y1="120" x2="330" y2="120" stroke="var(--grid)"/>
    <line x1="34" y1="20"  x2="34"  y2="120" stroke="var(--grid)"/>
    <text x="14" y="34" fill="var(--dim)" font-size="10">9</text>
    <text x="14" y="124" fill="var(--dim)" font-size="10">4</text>
    <g id="dots"></g>
  </svg>

  <button class="replay" id="replay" onclick="play()">↻ ещё раз</button>
</div>

<script>
const $=s=>document.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function type(el,txt,sp=32){return new Promise(async res=>{
  el.textContent='';el.classList.add('show');
  const c=document.createElement('span');c.className='caret';el.appendChild(c);
  for(const ch of txt){c.insertAdjacentText('beforebegin',ch);await wait(sp);}
  c.classList.remove('caret');res();
});}
// x: время 0..24 -> 34..330 ; y: 4..9 ммоль -> 120..20
const X=h=>34+(h/24)*296, Y=v=>120-((v-4)/5)*100;

async function play(){
  // сброс
  $('#meterWrap').className='';$('#numText').textContent='';$('#drop').classList.remove('show');
  $('#label').className='';$('#label').textContent='';
  $('#bubble').className='';$('#bubble').textContent='';
  $('#chart').className='';$('#dots').innerHTML='';$('#replay').classList.remove('show');
  await wait(300);

  // 1. прибор въезжает
  $('#meterWrap').classList.add('in');
  await wait(900);
  // 2. капля + замер-вспышка
  $('#drop').classList.add('show');await wait(400);
  $('#flash').classList.add('go');await wait(500);$('#flash').classList.remove('go');
  // 3. цифра проявляется
  $('#numText').textContent='6.1';
  $('#numText').animate([{opacity:0},{opacity:1}],{duration:400,fill:'forwards'});
  await wait(500);
  // 4. ярлык
  $('#label').textContent='натощак';$('#label').classList.add('show');
  await wait(500);
  // 5. прибор отъезжает, график появляется
  $('#meterWrap').classList.add('shift');
  $('#chart').classList.add('show');
  await wait(600);
  // 6. точка падает на график
  const g=$('#dots');const cx=X(2),cy=Y(6.1);
  g.innerHTML='<circle class="dot" cx="'+cx+'" cy="'+cy+'" r="6" fill="var(--accent)"/>'+
              '<text x="'+cx+'" y="'+(cy-12)+'" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" opacity="0" id="dl">6.1</text>';
  const dot=g.querySelector('.dot'),dl=g.querySelector('#dl');
  dot.animate([{transform:'translateY(-40px)',opacity:0},{transform:'translateY(0)',opacity:1}],
    {duration:500,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
  await wait(400);dl.animate([{opacity:0},{opacity:1}],{duration:300,fill:'forwards'});
  await wait(400);
  // 7. комментарий печатается
  await type($('#bubble'),'Базовая линия. Сахар до первой еды — как печень отработала ночь. От неё читается всё остальное.');
  await wait(400);
  $('#replay').classList.add('show');
}
play();
</script>
</body>
</html>
