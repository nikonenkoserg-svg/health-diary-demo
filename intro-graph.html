<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Старт дневника — проба</title>
<style>
  :root{--bg:#0f0f16;--panel:#1c1c26;--ink:#e9e9f0;--dim:#8a8a99;--accent:#e8845a;--grid:#292935}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:-apple-system,'SF Pro Text',Roboto,Segoe UI,sans-serif}
  #wrap{height:100%;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:20px;max-width:460px;margin:0 auto}
  #bubble{background:var(--panel);border-radius:16px;padding:14px 16px;font-size:15.5px;line-height:1.5;min-height:70px}
  .caret{border-right:2px solid var(--accent);animation:blink 1s step-end infinite}
  @keyframes blink{50%{border-color:transparent}}
  /* иконки трекеров */
  #icons{display:flex;gap:14px;justify-content:center;height:46px;align-items:center}
  .ic{width:38px;height:38px;opacity:0;transform:translateY(8px) scale(.7)}
  .ic svg{width:100%;height:100%;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ic .fillc{fill:var(--accent);stroke:none}
  .ic-cap{font-size:10px;color:var(--dim);text-align:center;margin-top:2px;white-space:nowrap}
  /* график */
  #card{background:var(--panel);border-radius:16px;padding:14px 12px 8px}
  #card h4{margin:0 0 8px 6px;font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.4px}
  .dot{opacity:0}
  .ring{fill:none;stroke:var(--accent);opacity:0}
  .num{fill:#fff;font-size:12px;font-weight:700;opacity:0}
  .lab{fill:var(--dim);font-size:11px;opacity:0;text-anchor:middle}
  #line{stroke:var(--accent);stroke-width:2;fill:none;opacity:0;transition:opacity .6s}
  .replay{align-self:center;color:var(--dim);background:none;border:1px solid var(--grid);border-radius:20px;
    padding:7px 18px;font-size:14px;opacity:0;transition:opacity .5s}
  .replay.show{opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <div id="bubble"></div>

  <div id="icons">
    <div class="ic" data-cap="кольцо"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M9 5.5 L12 2 L15 5.5"/></svg></div>
    <div class="ic" data-cap="браслет"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.5"/><path d="M9 7 V3.5 h6 V7 M9 17 v3.5 h6 V17"/></svg></div>
    <div class="ic" data-cap="весы"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="12" cy="12" r="4"/><path d="M12 12 l2-2"/></svg></div>
    <div class="ic" data-cap="шаги"><svg viewBox="0 0 24 24"><path d="M8 4 c-2 3-2 7 0 9 c1 1 1 3 0 5"/><path d="M15 6 c2 2 2 6 1 8 c-1 1 0 3 1 4"/></svg></div>
    <div class="ic" data-cap="глюкометр"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="15" rx="2"/><rect x="9" y="5" width="6" height="4" rx="1" class="fillc"/><path d="M12 18 v3"/></svg></div>
    <div class="ic" data-cap="ощущения"><svg viewBox="0 0 24 24"><path d="M12 20 C6 15 3 11 3 8 a4 4 0 0 1 9-1 a4 4 0 0 1 9 1 c0 3-3 7-9 12 Z"/></svg></div>
  </div>

  <div id="card">
    <h4>КАРТИНА ДНЯ · сахар, ммоль/л</h4>
    <svg id="g" viewBox="0 0 360 170">
      <line x1="40" y1="150" x2="345" y2="150" stroke="var(--grid)"/>
      <line x1="40" y1="20"  x2="40"  y2="150" stroke="var(--grid)"/>
      <text x="24" y="34" fill="var(--dim)" font-size="10">9</text>
      <text x="24" y="153" fill="var(--dim)" font-size="10">4</text>
      <text x="118" y="166" class="lab" id="lb1">натощак</text>
      <text x="210" y="166" class="lab" id="lb2">после еды</text>
      <text x="305" y="166" class="lab" id="lb3">чистая ночь</text>
      <polyline id="line" points="118,104 210,58 305,117"/>
      <circle class="ring" id="r1" cx="118" cy="104"/>
      <circle class="ring" id="r2" cx="210" cy="58"/>
      <circle class="ring" id="r3" cx="305" cy="117"/>
      <circle class="dot" id="p1" cx="118" cy="104" r="6" fill="var(--accent)"/>
      <circle class="dot" id="p2" cx="210" cy="58"  r="6" fill="var(--accent)"/>
      <circle class="dot" id="p3" cx="305" cy="117" r="6" fill="var(--accent)"/>
      <text class="num" id="v1" x="118" y="90"  text-anchor="middle">6.1</text>
      <text class="num" id="v2" x="210" y="44"  text-anchor="middle">8.2</text>
      <text class="num" id="v3" x="305" y="103" text-anchor="middle">5.4</text>
    </svg>
  </div>

  <button class="replay" id="rp" onclick="play()">↻ ещё раз</button>
</div>
<script>
const $=s=>document.querySelector(s), wait=ms=>new Promise(r=>setTimeout(r,ms));
function type(el,txt,sp=28){return new Promise(async res=>{
  const c=document.createElement('span');c.className='caret';el.appendChild(c);
  for(const ch of txt){c.insertAdjacentText('beforebegin',ch);await wait(sp);}
  c.remove();res();
});}
function flash(i){
  const dot=$('#p'+i),ring=$('#r'+i),num=$('#v'+i),lab=$('#lb'+i);
  dot.animate([{opacity:0,transform:'scale(.2)'},{opacity:1,transform:'scale(1)'}],{duration:350,easing:'cubic-bezier(.2,.9,.3,1.3)',fill:'forwards'});
  ring.setAttribute('r',6);
  ring.animate([{opacity:.7,r:6,'stroke-width':2},{opacity:0,r:20,'stroke-width':0}],{duration:600,fill:'forwards'});
  setTimeout(()=>{num.animate([{opacity:0},{opacity:1}],{duration:250,fill:'forwards'});
                  lab.animate([{opacity:0},{opacity:1}],{duration:250,fill:'forwards'});},200);
}
function showIcon(el){el.animate([{opacity:0,transform:'translateY(8px) scale(.7)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:350,easing:'cubic-bezier(.2,.9,.3,1.2)',fill:'forwards'});}

async function play(){
  $('#bubble').innerHTML='';
  document.querySelectorAll('.dot,.num,.lab,.ring').forEach(e=>e.style.opacity=0);
  $('#line').style.opacity=0; $('#rp').classList.remove('show');
  document.querySelectorAll('.ic').forEach(e=>{e.style.opacity=0;e.querySelector('.ic-cap')&&e.querySelector('.ic-cap').remove()});
  await wait(400);
  const b=$('#bubble');
  await type(b,'Начнём с трёх замеров — это каркас, на него ляжет всё остальное.\n\n');
  await type(b,'Натощак утром'); flash(1); await type(b,' — базовая линия. ');
  await type(b,'Через пару часов после плотной еды'); flash(2); await type(b,' — как быстро уходит пик. ');
  await type(b,'И одна чистая ночь'); flash(3); await type(b,' — сон без еды за 3 часа.');
  await wait(300); $('#line').style.opacity=1; await wait(500);
  await type(b,'\n\nДальше подключим всё, что носишь:');
  const ics=document.querySelectorAll('.ic');
  for(const ic of ics){ showIcon(ic);
    const cap=document.createElement('div');cap.className='ic-cap';cap.textContent=ic.dataset.cap;
    await wait(120); await wait(280);
  }
  await wait(200);
  await type(b,' и твои собственные ощущения. Всё сходится в одну картину.');
  await wait(300); $('#rp').classList.add('show');
}
window.addEventListener('load',()=>setTimeout(play,400));
</script>
</body>
</html>
